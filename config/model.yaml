# F3 — XGBoost tahmin modeli

model:
  name: xgboost
  version: "1.1"
  path: data/models/xgb_up.pkl

features:
  min_history_days: 60
  # forward_return ufku, gün cinsinden: etiket close(D+h)/open(D+1) - 1
  # (bkz. pipeline/features.py::add_technical_features).
  horizon: 5
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  sma_short: 20
  sma_long: 50
  sentiment_lag_days: 3
  # D kapanışında henüz mevcut olmayabilecek günlük sentiment agregasyonunu
  # dışarıda bırakan tutucu gecikme (bkz. pipeline/dataset.py::build_dataset).
  sentiment_availability_lag_days: 1

training:
  test_ratio: 0.2
  random_state: 42
  xgb:
    # 2026-09-25: walk-forward pencereleri 250-460 satır arası, günlük yön
    # etiketi gürültülü — max_depth=5/n_estimators=200 (eski) reg. yok, gürültüyü
    # ezberliyordu. eval_set zaten veriliyor (walk_forward.py), early stopping
    # onu kullanır. Bkz. plan: ancient-tinkering-acorn.md, Faz 1.
    n_estimators: 500
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 50
    reg_lambda: 5
    early_stopping_rounds: 30
    eval_metric: logloss

prediction:
  direction_threshold: 0.5
