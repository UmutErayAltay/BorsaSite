# Faz 1-3 — historical backtest motoru
# Maliyet senaryoları config-driven: "BIST'in evrensel komisyonu" TEK bir sabit
# değer değil, BASE/CONSERVATIVE/STRESS karşılaştırmalı olarak çalıştırılır.
scenarios:
  base:
    slippage_bps: 0
    spread_bps: 0
  conservative:
    slippage_bps: 10
    spread_bps: 20
  stress:
    slippage_bps: 30
    spread_bps: 50

default_scenario: base
bist_only: true
