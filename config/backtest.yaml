# Faz 1-3 — historical backtest motoru (aynı-bar, tek model, bkz. docs/BACKTEST.md)
# + Faz 4 — walk-forward motoru (bkz. backtest/walk_forward.py).
# Maliyet senaryoları config-driven: "BIST'in evrensel komisyonu" TEK bir sabit
# değer değil, BASE/CONSERVATIVE/STRESS karşılaştırmalı olarak çalıştırılır.
# Komisyon/BSMV zaten config/trading.yaml'dan geliyor, burada tekrar edilmez.
scenarios:
  base:
    slippage_bps: 0
    spread_bps: 0
  conservative:
    slippage_bps: 10
    spread_bps: 20
  stress:
    slippage_bps: 30
    spread_bps: 50

default_scenario: base
bist_only: true

# bkz. backtest/walk_forward.py::WalkForwardConfig — her pencere TRAIN ->
# VALIDATION -> OOS sırasıyla ilerler, calibration/threshold SADECE
# validation'da fit edilir. Faz 1-3'ün aynı-bar/tek-model motorundan
# (backtest/engine.py) ayrı, tamamlayıcı bir motor.
walk_forward:
  train_days: 504
  validation_days: 63
  oos_days: 63
  step_days: 63
  min_train_rows: 100
  calibration_method: sigmoid
  min_threshold_trades: 10
  execution_delay_days: 1
