# Faz 9-10 - intraday (1h) tahmin modeli, günlük modelden TAMAMEN ayri

model:
  name: xgboost_intraday
  version: "2.0"
  path: data/models/xgb_intraday_1h.pkl

interval: "1h"

features:
  min_history_bars: 200
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  sma_short: 20

training:
  test_ratio: 0.2
  val_ratio: 0.2
  random_state: 42
  xgb:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.03
    min_child_weight: 50
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
  xgb_regressor:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.03
    min_child_weight: 50
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: rmse

strategy:
  # Giris esigi: regresorun VALIDATION tahminlerinin bu kantili. 0.998 degeri
  # 2026-09-27'de val uzerinde (esik x pozisyon buyuklugu izgarasi) secildi,
  # test'e bakilmadan — bkz. docs/BACKTEST_AUDIT.md §11 madde 10.
  entry_quantile: 0.998

prediction:
  direction_threshold: 0.5
