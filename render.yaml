# Render Blueprint — https://render.com/docs/blueprint-spec
# Kullanım: Render Dashboard → New → Blueprint → bu repo'yu seç.
# sync: false olan değişkenlerin DEĞERLERİ dashboard'dan elle girilir.
services:
  - type: web
    name: borsa-ai-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false

  - type: cron
    name: borsa-ai-daily
    runtime: python
    plan: starter
    schedule: "0 16 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_daily.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
