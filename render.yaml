# Render Blueprint — https://render.com/docs/blueprint-spec
# Kullanım: Render Dashboard → New → Blueprint → bu repo'yu seç.
# sync: false olan değişkenlerin DEĞERLERİ dashboard'dan elle girilir.
#
# Günlük alım-satım pipeline'ı BURADA değil, GitHub Actions'ta çalışıyor
# (.github/workflows/daily-trading.yml) — Render Cron Job servisleri ödeme
# bilgisi gerektiriyor (aylık asgari $1), GitHub Actions public repo için
# tamamen ücretsiz ve süre sınırı çok daha gevşek (ML modelleri indirmek
# dakikalar sürebiliyor).
services:
  - type: web
    name: borsa-ai-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
